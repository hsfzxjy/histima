[package]
name = "histima"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "histima"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.145"
tima = { path = "../tima" }
toml = "=1.1.6"
ureq = "=3.4.2"

[dev-dependencies]
png = "=0.18.1"
